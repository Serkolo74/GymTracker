<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Gym Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #0b1220;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --blue: #38bdf8;
      --danger: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.25rem;
      line-height: 1.5;
      padding-bottom: 3rem;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .brand img {
      width: 34px;
      height: 34px;
      border-radius: 8px;
    }

    h1 { font-size: 1.4rem; }
    h2 { font-size: 0.95rem; margin-bottom: 0.75rem; color: var(--muted); font-weight: 600; }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .grid-top {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }

    .stat-box {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 0.6rem;
      padding: 0.75rem;
    }

    .stat-label { color: var(--muted); font-size: 0.8rem; }
    .stat-value { font-size: 1.3rem; font-weight: 700; margin-top: 0.2rem; }

    /* Temporizador */
    .timer-display {
      font-size: 2rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--blue);
      margin-bottom: 0.6rem;
    }

    .timer-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    /* Formulario */
    form {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem;
      display: grid;
      grid-template-columns: 2fr 1.2fr 0.8fr 0.8fr 0.9fr auto;
      gap: 0.65rem;
      margin-bottom: 1.25rem;
    }

    input, select, button {
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      padding: 0.55rem 0.7rem;
      font-size: 0.9rem;
    }

    input, select {
      background: var(--bg);
      color: var(--text);
      width: 100%;
    }

    button {
      background: var(--accent);
      color: #052e16;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }

    button:hover { background: var(--accent-hover); }

    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      font-weight: 500;
      padding: 0.4rem 0.65rem;
      font-size: 0.82rem;
    }

    .btn-secondary:hover, .btn-secondary.active {
      background: var(--blue);
      color: #082f49;
      border-color: var(--blue);
    }

    /* Gráfico */
    .chart-wrap {
      margin-bottom: 1.25rem;
    }

    canvas {
      width: 100%;
      height: 180px;
      display: block;
      background: var(--card-2);
      border-radius: 0.6rem;
      border: 1px solid var(--border);
    }

    /* Filtros y Lista */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 1rem;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--blue);
      margin-left: 0.4rem;
      vertical-align: middle;
    }

    .item-meta { color: var(--muted); font-size: 0.85rem; margin-top: 0.2rem; }

    .btn-delete {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 0.35rem 0.65rem;
      font-size: 0.82rem;
    }

    .btn-delete:hover {
      background: var(--danger);
      color: white;
    }

    @media (max-width: 720px) {
      .grid-top { grid-template-columns: 1fr; }
      form { grid-template-columns: 1fr 1fr; }
      form button[type="submit"] { grid-column: span 2; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <img src="icon-192.png" alt="Gym Tracker Icon" />
        <h1>Gym Tracker</h1>
      </div>
      <div class="header-actions">
        <button type="button" class="btn-secondary" id="exportBtn">Exportar JSON</button>
        <button type="button" class="btn-secondary" id="importBtn">Importar JSON</button>
        <input type="file" id="importFile" accept=".json,application/json" style="display:none" />
        <button type="button" class="btn-secondary" id="clearBtn">Borrar</button>
      </div>
    </header>

    <div class="grid-top">
      <section class="card">
        <h2>Resumen (según filtro)</h2>
        <div class="stats">
          <div class="stat-box">
            <div class="stat-label">Series</div>
            <div class="stat-value" id="totalSets">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Volumen total</div>
            <div class="stat-value" id="totalVolume">0 kg</div>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Temporizador de descanso</h2>
        <div class="timer-display" id="timerDisplay">01:30</div>
        <div class="timer-controls">
          <button type="button" class="btn-secondary" data-time="60">60s</button>
          <button type="button" class="btn-secondary" data-time="90">90s</button>
          <button type="button" class="btn-secondary" data-time="120">2m</button>
          <button type="button" id="timerToggle">Iniciar</button>
          <button type="button" class="btn-secondary" id="timerReset">Reiniciar</button>
        </div>
      </section>
    </div>

    <form id="workoutForm">
      <input type="text" id="exercise" placeholder="Ejercicio (ej. Sentadilla)" required />
      <select id="muscle">
        <option value="Pecho">Pecho</option>
        <option value="Espalda">Espalda</option>
        <option value="Pierna">Pierna</option>
        <option value="Hombro">Hombro</option>
        <option value="Brazos">Brazos</option>
        <option value="Core">Core</option>
      </select>
      <input type="number" id="sets" placeholder="Series" min="1" value="3" required />
      <input type="number" id="reps" placeholder="Reps" min="1" value="10" required />
      <input type="number" id="weight" placeholder="Kg" min="0" step="0.5" value="60" required />
      <button type="submit">Añadir</button>
    </form>

    <section class="card chart-wrap">
      <h2>Progreso de volumen por registro (kg)</h2>
      <canvas id="progressChart" width="760" height="180"></canvas>
    </section>

    <section class="filters" id="filterBar">
      <button type="button" class="btn-secondary active" data-filter="Todos">Todos</button>
      <button type="button" class="btn-secondary" data-filter="Pecho">Pecho</button>
      <button type="button" class="btn-secondary" data-filter="Espalda">Espalda</button>
      <button type="button" class="btn-secondary" data-filter="Pierna">Pierna</button>
      <button type="button" class="btn-secondary" data-filter="Hombro">Hombro</button>
      <button type="button" class="btn-secondary" data-filter="Brazos">Brazos</button>
      <button type="button" class="btn-secondary" data-filter="Core">Core</button>
    </section>

    <section class="list" id="workoutList"></section>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    const STORAGE_KEY = 'gym_tracker_preview_v3';
    let entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let currentFilter = 'Todos';

    const form = document.getElementById('workoutForm');
    const listEl = document.getElementById('workoutList');
    const totalSetsEl = document.getElementById('totalSets');
    const totalVolumeEl = document.getElementById('totalVolume');
    const canvas = document.getElementById('progressChart');
    const ctx = canvas.getContext('2d');

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    function getFilteredEntries() {
      return currentFilter === 'Todos'
        ? entries
        : entries.filter(e => e.muscle === currentFilter);
    }

    function drawChart(data) {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const ordered = [...data].reverse();
      if (ordered.length === 0) {
        ctx.fillStyle = '#94a3b8';
        ctx.font = '14px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('Añade registros para ver la gráfica de volumen', w / 2, h / 2);
        return;
      }

      const volumes = ordered.map(e => e.sets * e.reps * e.weight);
      const maxVol = Math.max(...volumes, 1);
      const pad = 28;
      const plotW = w - pad * 2;
      const plotH = h - pad * 2;

      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pad, h - pad);
      ctx.lineTo(w - pad, h - pad);
      ctx.stroke();

      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 2.5;
      ctx.beginPath();

      ordered.forEach((entry, i) => {
        const vol = volumes[i];
        const x = ordered.length === 1
          ? w / 2
          : pad + (i / (ordered.length - 1)) * plotW;
        const y = h - pad - (vol / maxVol) * plotH;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      ordered.forEach((entry, i) => {
        const vol = volumes[i];
        const x = ordered.length === 1
          ? w / 2
          : pad + (i / (ordered.length - 1)) * plotW;
        const y = h - pad - (vol / maxVol) * plotH;

        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(x, y, 4.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#f8fafc';
        ctx.font = '11px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText(`${vol} kg`, x, y - 9);
      });
    }

    function render() {
      const filtered = getFilteredEntries();
      listEl.innerHTML = '';
      let setsSum = 0;
      let volumeSum = 0;

      filtered.forEach((entry) => {
        const volume = entry.sets * entry.reps * entry.weight;
        setsSum += entry.sets;
        volumeSum += volume;

        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <div>
            <strong>${entry.exercise}</strong>
            <span class="badge">${entry.muscle}</span>
            <div class="item-meta">${entry.sets} series × ${entry.reps} reps @ ${entry.weight} kg · Volumen: ${volume.toLocaleString('es-ES')} kg</div>
          </div>
          <button type="button" class="btn-delete" data-id="${entry.id}">Eliminar</button>
        `;
        listEl.appendChild(div);
      });

      totalSetsEl.textContent = setsSum;
      totalVolumeEl.textContent = `${volumeSum.toLocaleString('es-ES')} kg`;
      drawChart(filtered);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const exercise = document.getElementById('exercise').value.trim();
      const muscle = document.getElementById('muscle').value;
      const sets = Number(document.getElementById('sets').value);
      const reps = Number(document.getElementById('reps').value);
      const weight = Number(document.getElementById('weight').value);

      if (!exercise) return;
      entries.unshift({
        id: Date.now(),
        date: new Date().toISOString(),
        exercise,
        muscle,
        sets,
        reps,
        weight
      });
      save();
      render();
      document.getElementById('exercise').value = '';
      document.getElementById('exercise').focus();
    });

    listEl.addEventListener('click', (e) => {
      if (e.target.matches('.btn-delete')) {
        const id = Number(e.target.dataset.id);
        entries = entries.filter(item => item.id !== id);
        save();
        render();
      }
    });

    document.getElementById('filterBar').addEventListener('click', (e) => {
      if (!e.target.matches('button')) return;
      currentFilter = e.target.dataset.filter;
      document.querySelectorAll('#filterBar button').forEach(btn => btn.classList.remove('active'));
      e.target.classList.add('active');
      render();
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      if (confirm('¿Seguro que quieres borrar todo el historial?')) {
        entries = [];
        save();
        render();
      }
    });

    // Exportar e Importar JSON
    document.getElementById('exportBtn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `gym-tracker-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    const importFile = document.getElementById('importFile');
    document.getElementById('importBtn').addEventListener('click', () => importFile.click());
    importFile.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (Array.isArray(parsed)) {
            entries = parsed;
            save();
            render();
            alert('Copia de seguridad restaurada correctamente.');
          } else {
            alert('El archivo JSON no tiene un formato válido.');
          }
        } catch (_) {
          alert('Error al leer el archivo JSON.');
        }
      };
      reader.readAsText(file);
      importFile.value = '';
    });

    // Temporizador
    let defaultDuration = 90;
    let remaining = defaultDuration;
    let timerInterval = null;

    const timerDisplay = document.getElementById('timerDisplay');
    const timerToggle = document.getElementById('timerToggle');

    function updateTimerUI() {
      const mins = String(Math.floor(remaining / 60)).padStart(2, '0');
      const secs = String(remaining % 60).padStart(2, '0');
      timerDisplay.textContent = `${mins}:${secs}`;
    }

    function beep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } catch (_) {}
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      timerToggle.textContent = 'Iniciar';
    }

    timerToggle.addEventListener('click', () => {
      if (timerInterval) {
        stopTimer();
        return;
      }
      if (remaining <= 0) remaining = defaultDuration;
      timerToggle.textContent = 'Pausar';
      timerInterval = setInterval(() => {
        remaining--;
        updateTimerUI();
        if (remaining <= 0) {
          stopTimer();
          beep();
        }
      }, 1000);
    });

    document.getElementById('timerReset').addEventListener('click', () => {
      stopTimer();
      remaining = defaultDuration;
      updateTimerUI();
    });

    document.querySelectorAll('[data-time]').forEach(btn => {
      btn.addEventListener('click', () => {
        stopTimer();
        defaultDuration = Number(btn.dataset.time);
        remaining = defaultDuration;
        updateTimerUI();
      });
    });

    updateTimerUI();
    render();
  </script>
</body>
</html>
